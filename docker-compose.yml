services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    volumes:
      - .:/app
      - /app/node_modules
    expose:
      - '5173'
    ports:
      - '5174:5173'
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - backend
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/fractal
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "--watch", "server/index.js"]
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fractal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
